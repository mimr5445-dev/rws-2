name: studio-ci

on:
  push:
    branches: ['**']
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: studio

jobs:
  quality:
    name: Quality (lint / types / unit / build / guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: studio/dist
          retention-days: 7

  e2e:
    name: E2E (Playwright 390x844 + 1280x800, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload shell screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-00-shots
          path: studio/docs/forge/shots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            studio/playwright-report
            studio/test-results
          if-no-files-found: ignore
          retention-days: 7
